services:
  postgres:
    image: postgres:16-alpine
    container_name: analista-tools-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=analista
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=analista_tools
      - TZ=Asia/Jakarta
    volumes:
      - analista_pgdata:/var/lib/postgresql/data
    ports:
      # Bind localhost saja — Postgres TIDAK boleh terekspos ke LAN/internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analista -d analista_tools"]
      interval: 10s
      timeout: 5s
      retries: 5

  analista-tools:
    build: .
    image: analista-tools:latest
    container_name: analista-tools
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bind ke localhost saja — akses eksternal via reverse proxy / Tailscale
      # Serve, jangan expose port 8501 langsung ke 0.0.0.0/LAN.
      - "127.0.0.1:8501:8501"
    extra_hosts:
      # PENTING: di Linux, host.docker.internal TIDAK otomatis ter-resolve
      # (beda dgn Docker Desktop macOS/Windows) — baris ini wajib supaya
      # container bisa panggil layanan yg jalan di HOST (bukan container
      # lain), misalnya 9Router (AI gateway) yg listen di 127.0.0.1:20128
      # pada host. Dipakai oleh utils/ai_generate.py.
      - "host.docker.internal:host-gateway"
    volumes:
      # Volume persisten: dataset yang diupload & cache. Data USER/ROLE/AUDIT
      # sekarang di Postgres (volume analista_pgdata), bukan di sini lagi.
      - analista_data:/app/data
    environment:
      - TZ=Asia/Jakarta
      - DATABASE_URL=postgresql://analista:${POSTGRES_PASSWORD}@postgres:5432/analista_tools
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: analista-tools-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - analista-tools
    # PENTING: network_mode "service:X" mengikat ke NETWORK NAMESPACE
    # container X saat ini. Kalau analista-tools di-recreate (mis. rebuild
    # image), namespace lama hilang dan cloudflared kehilangan koneksi
    # ("network is unreachable"). Setelah rebuild analista-tools, WAJIB
    # jalankan juga: docker compose up -d --force-recreate cloudflared
    network_mode: "service:analista-tools"

volumes:
  analista_data:
    driver: local
  analista_pgdata:
    driver: local
