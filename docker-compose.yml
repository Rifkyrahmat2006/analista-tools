services:
  analista-tools:
    build: .
    image: analista-tools:latest
    container_name: analista-tools
    restart: unless-stopped
    ports:
      # Bind ke localhost saja — akses eksternal via reverse proxy / Tailscale
      # Serve, jangan expose port 8501 langsung ke 0.0.0.0/LAN.
      - "127.0.0.1:8501:8501"
    volumes:
      # Volume persisten: database (users, audit log, assignments), dataset
      # yang diupload, dan cache. Data ini HARUS selamat lintas rebuild image.
      - analista_data:/app/data
    environment:
      - TZ=Asia/Jakarta

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: analista-tools-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - analista-tools
    # PENTING: network_mode "service:X" mengikat ke NETWORK NAMESPACE
    # container X saat ini. Kalau analista-tools di-recreate (mis. rebuild
    # image), namespace lama hilang dan cloudflared kehilangan koneksi
    # ("network is unreachable"). Setelah rebuild analista-tools, WAJIB
    # jalankan juga: docker compose up -d --force-recreate cloudflared
    network_mode: "service:analista-tools"

volumes:
  analista_data:
    driver: local
